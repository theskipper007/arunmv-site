<svg viewBox="0 0 680 370" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Your vector database is lying to you about multi-hop</title>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="0.9" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C2402F" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#C2402F" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="680" height="370" fill="#0a0d12"/>
  <rect width="680" height="370" fill="url(#dots)"/>
  <ellipse cx="540" cy="180" rx="200" ry="175" fill="url(#glow)"/>

  <!-- candidate cloud -->
  <g fill="#2f3550">
    <circle cx="462" cy="120" r="2.4"/><circle cx="500" cy="98" r="2.4"/>
    <circle cx="470" cy="252" r="2.4"/><circle cx="448" cy="186" r="2.4"/>
    <circle cx="560" cy="90" r="2.4"/><circle cx="500" cy="240" r="2.4"/>
  </g>

  <!-- search radius: confidently tight, and it misses the answer -->
  <circle cx="518" cy="176" r="56" fill="none" stroke="#C2402F" stroke-width="1" stroke-dasharray="4 5" opacity="0.55"/>

  <!-- hop-1 docs, comfortably inside the radius -->
  <g stroke="#22D3EE" stroke-width="1.3" opacity="0.75">
    <line x1="518" y1="176" x2="494" y2="150"/>
    <line x1="518" y1="176" x2="552" y2="152"/>
    <line x1="518" y1="176" x2="486" y2="204"/>
  </g>
  <g fill="#0a0d12" stroke="#22D3EE" stroke-width="1.4">
    <circle cx="494" cy="150" r="5"/><circle cx="552" cy="152" r="5"/><circle cx="486" cy="204" r="5"/>
  </g>

  <!-- query point, high confidence -->
  <circle cx="518" cy="176" r="12" fill="#C2402F" opacity="0.5" filter="url(#blur)"/>
  <circle cx="518" cy="176" r="7" fill="#C2402F"/>

  <!-- the bridge-hop answer, sitting outside the radius, unreached -->
  <line x1="518" y1="176" x2="626" y2="266" stroke="#C2402F" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.45"/>
  <circle cx="626" cy="266" r="6" fill="none" stroke="#C2402F" stroke-width="1.6" opacity="0.9"/>
  <g stroke="#C2402F" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M622 262 L630 270 M630 262 L622 270"/>
  </g>
  <text x="600" y="292" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" fill="#C2402F" opacity="0.85">hop 2 — never retrieved</text>

  <!-- confident badge near the query -->
  <text x="524" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#f2f5f7" opacity="0.8">sim 0.82 ✓</text>

  <!-- text -->
  <text x="56" y="98" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.16em" fill="#C2402F">RETRIEVAL · MULTI-HOP</text>
  <text x="55" y="150" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em" fill="#f2f5f7">Your Vector DB</text>
  <text x="55" y="190" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em" fill="#f2f5f7">Is Lying to You</text>
  <text x="55" y="230" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="-0.01em" fill="#C2402F">About Multi-Hop</text>
  <line x1="56" y1="250" x2="200" y2="250" stroke="#C2402F" stroke-width="2" opacity="0.7"/>
  <text x="56" y="312" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#3a4049">A confident score, a proven ceiling, and an answer it never retrieved</text>
</svg>
